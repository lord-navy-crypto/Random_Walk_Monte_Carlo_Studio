name: In-app setup handoff smoke check

on:
  pull_request:
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]
  push:
    branches: [main]
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]

jobs:
  syntax-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify app syntax and reproducibility controls
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("app.py").read_text(encoding="utf-8")
          compile(src, "app.py", "exec")
          assert "Pin current seed" in src
          assert "Restore pinned seed" in src
          assert 'key="rw-global-seed"' in src
          print("PASS: Random-walk reproducibility handoff")
          PY
